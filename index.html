<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeScan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dark">

  <!-- HEADER -->
  <header class="app-header">
    <div class="logo">🥗 SafeScan</div>
    <p>Scan or search products to see health scores.</p>
    <button id="themeToggle" class="theme-btn">🌙 Dark / ☀️ Light</button>
  </header>

  <!-- MAIN CONTENT -->
  <main id="mainContent">

    <!-- SCAN TAB -->
    <section id="tab-scan" class="tab-section active-tab">
      <h2>Scan a Barcode</h2>

      <div class="camera-container">
        <video id="camera" playsinline></video>

        <div class="camera-overlay">
          <button id="closeScan">✖</button>
        </div>
      </div>

      <button id="scanBtn">Start Scan</button>
      <p id="scanStatus"></p>
    </section>

    <!-- SEARCH TAB -->
    <section id="tab-search" class="tab-section">
      <h2>Search Products</h2>

      <div class="search-row">
        <input type="text" id="searchBox" placeholder="Search by name...">
        <button id="searchBtn">Search</button>
      </div>

      <section id="searchResults"></section>
    </section>

    <!-- FAVORITES TAB -->
    <section id="tab-favorites" class="tab-section">
      <h2>Favorites</h2>
      <div id="favorites"></div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="tab-section">
      <h2>Scan History</h2>
      <div id="history"></div>
    </section>

  </main>

  <!-- MODAL -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <span id="modalClose" class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-btn active-nav" data-tab="tab-scan">🥗 Scan</button>
    <button class="nav-btn" data-tab="tab-search">🔍 Search</button>
    <button class="nav-btn" data-tab="tab-favorites">⭐ Favorites</button>
    <button class="nav-btn" data-tab="tab-history">🕘 History</button>
  </nav>

  <footer>
    <p>SafeScan • Powered by Open Food Facts</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
