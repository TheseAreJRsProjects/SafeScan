<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeScan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dark">

  <!-- HEADER -->
  <header class="app-header">
    <div class="logo">🥗 SafeScan</div>
    <p>Scan or search products to see health scores.</p>
    <button id="themeToggle" class="theme-btn">🌙 Dark / ☀️ Light</button>
  </header>

  <main>

    <!-- SCAN SECTION -->
    <section id="scanSection">
      <h2>Scan a Barcode</h2>

      <div class="camera-container">
        <video id="camera" playsinline></video>

        <div class="camera-overlay">
          <button id="closeScan">✖</button>
        </div>
      </div>

      <button id="scanBtn">Start Scan</button>
      <p id="scanStatus"></p>
    </section>

    <!-- SEARCH SECTION -->
    <section id="searchSection">
      <h2>Search Products</h2>

      <div class="search-row">
        <input type="text" id="searchBox" placeholder="Search by name...">
        <button id="searchBtn">Search</button>
      </div>

      <section id="searchResults"></section>
    </section>

    <!-- HISTORY SECTION -->
    <section id="historySection">
      <h2>Scan History</h2>
      <div id="history"></div>
    </section>

  </main>

  <!-- MODAL -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <span id="modalClose" class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- FOOTER -->
