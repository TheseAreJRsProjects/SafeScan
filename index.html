<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeScan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>SafeScan</h1>
    <p>Scan or search products to see health scores and details.</p>
  </header>

  <main>

    <!-- Scan Section -->
    <section id="scanSection">
      <h2>Scan a Barcode</h2>

      <div class="camera-container">
        <video id="camera" playsinline></video>

        <div class="camera-overlay">
          <button id="flashToggle">🔦</button>
          <button id="closeScan">✖</button>
        </div>
      </div>

      <button id="scanBtn">Start Scan</button>
      <p id="scanStatus"></p>
    </section>

    <!-- Search Section -->
    <section id="searchSection">
      <h2>Search Products</h2>
      <input type="text" id="searchBox" placeholder="Search by name...">
      <button id="searchBtn">Search</button>
      <section id="searchResults"></section>
    </section>

    <!-- History -->
    <section id="historySection">
      <h2>Scan History</h2>
      <div id="history"></div>
    </section>

  </main>

  <!-- Modal -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <span id="modalClose" class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <p>SafeScan • Powered by Open Food Facts</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
