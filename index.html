<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeScan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>SafeScan</h1>
    <p>Scan or search products to see health flags and scores.</p>
  </header>

  <main>
    <!-- Scan section -->
    <section id="scanSection">
      <h2>Scan a Barcode</h2>
      <button id="scanBtn">Start Scan</button>
      <video id="camera" playsinline></video>
      <p id="scanStatus"></p>
    </section>

    <!-- Search section -->
    <section id="searchSection">
      <h2>Search Products</h2>
      <input type="text" id="searchBox" placeholder="Search by name...">
      <button id="searchBtn">Search</button>
      <section id="searchResults"></section>
    </section>

    <!-- Preferences -->
    <section id="prefs">
      <h2>User Preferences</h2>
      <label>
        <input type="checkbox" id="avoidSeedOils">
        Avoid Seed Oils
      </label><br>
      <label>
        <input type="checkbox" id="vegan">
        Vegan
      </label>
    </section>

    <!-- Current product result -->
    <section id="resultSection">
      <h2>Product Details</h2>
      <div id="result"></div>
    </section>

    <!-- History -->
    <section id="historySection">
      <h2>Scan History</h2>
      <div id="history"></div>
    </section>
  </main>

  <footer>
    <p>SafeScan • Powered by Open Food Facts • All local, no accounts, no paywall.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
